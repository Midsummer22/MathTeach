<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二面角动态演示</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --plane-a: rgba(64, 160, 255, 0.18);
    --plane-b: rgba(255, 160, 64, 0.18);
    --edge-a: #40a0ff;
    --edge-b: #ffa040;
    --axis: #a0e0a0;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --gold: #f0a040;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif SC', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    padding: 20px 40px 0;
    display: flex;
    align-items: baseline;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
  }

  header h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--text);
  }

  header span {
    font-size: 0.85rem;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .main-layout {
    display: flex;
    width: 100%;
    max-width: 1200px;
    gap: 24px;
    padding: 24px;
    flex: 1;
  }

  .canvas-wrap {
    flex: 1;
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    min-height: 520px;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
  }

  canvas:active { cursor: grabbing; }

  .canvas-label {
    position: absolute;
    top: 14px;
    left: 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    pointer-events: none;
  }

  .side-panel {
    width: 260px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }

  .card h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 16px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Angle display */
  .angle-display {
    text-align: center;
    padding: 10px 0;
  }

  .angle-big {
    font-size: 3.2rem;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    color: var(--gold);
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .angle-big sup {
    font-size: 1.4rem;
    vertical-align: super;
    color: var(--gold);
  }

  .angle-label {
    margin-top: 6px;
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  /* Slider */
  .slider-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .slider-row label {
    font-size: 0.78rem;
    color: var(--muted);
    width: 50px;
    font-family: 'JetBrains Mono', monospace;
  }

  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
    cursor: pointer;
    transition: transform 0.15s;
  }

  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.3);
  }

  /* Buttons */
  .btn-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .btn {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    border-radius: 8px;
    font-size: 0.78rem;
    font-family: 'Noto Serif SC', serif;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(88, 166, 255, 0.08);
  }

  .btn.active {
    background: rgba(88, 166, 255, 0.15);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Legend */
  .legend {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.82rem;
  }

  .legend-color {
    width: 28px;
    height: 4px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .legend-swatch {
    width: 16px;
    height: 16px;
    border-radius: 3px;
    flex-shrink: 0;
    opacity: 0.6;
  }

  /* Definition box */
  .def-box {
    font-size: 0.8rem;
    line-height: 1.8;
    color: #c9d1d9;
    border-left: 3px solid var(--gold);
    padding-left: 12px;
  }

  .def-box strong {
    color: var(--gold);
  }

  /* Auto rotate button */
  .btn-auto {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    border-radius: 8px;
    font-size: 0.82rem;
    font-family: 'Noto Serif SC', serif;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn-auto:hover { border-color: var(--axis); color: var(--axis); }
  .btn-auto.active { border-color: var(--axis); color: var(--axis); background: rgba(160, 224, 160, 0.08); }

  .dot-anim {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--axis);
    animation: pulse 1s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  footer {
    padding: 12px;
    font-size: 0.7rem;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>

<header>
  <h1>二面角 · 动态演示</h1>
  <span>立体几何 · 高中数学</span>
</header>

<div class="main-layout">
  <div class="canvas-wrap">
    <canvas id="c"></canvas>
    <div class="canvas-label">拖动旋转视角 · DRAG TO ORBIT</div>
  </div>

  <div class="side-panel">

    <!-- Angle value -->
    <div class="card">
      <h2>当前二面角</h2>
      <div class="angle-display">
        <div class="angle-big" id="angleVal">90<sup>°</sup></div>
        <div class="angle-label">二面角 α–l–β 的大小</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="card">
      <h2>调节控制</h2>
      <div class="slider-group">
        <div class="slider-row">
          <label>角度</label>
          <input type="range" id="angleSlider" min="5" max="175" value="90" step="1">
        </div>
        <div class="slider-row">
          <label>半径</label>
          <input type="range" id="radiusSlider" min="30" max="90" value="60" step="1">
        </div>
        <div class="slider-row">
          <label>缩放</label>
          <input type="range" id="zoomSlider" min="50" max="200" value="100" step="1">
        </div>
      </div>
      <div class="btn-group" style="margin-top:14px;">
        <button class="btn" onclick="setAngle(30)">30°</button>
        <button class="btn" onclick="setAngle(60)">60°</button>
        <button class="btn" onclick="setAngle(90)">90°</button>
        <button class="btn" onclick="setAngle(120)">120°</button>
        <button class="btn" onclick="setAngle(150)">150°</button>
      </div>
      <button class="btn-auto" id="autoBtn" onclick="toggleAuto()">
        <span id="autoDot" class="dot-anim" style="display:none"></span>
        <span id="autoTxt">▶ 自动旋转角度</span>
      </button>
    </div>

    <!-- Legend -->
    <div class="card">
      <h2>图例说明</h2>
      <div class="legend">
        <div class="legend-item">
          <div class="legend-color" style="background:#40a0ff;"></div>
          <span>半平面 α（蓝色）</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background:#ffa040;"></div>
          <span>半平面 β（橙色）</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background:#a0e0a0; height:2px; border-top: 2px dashed #a0e0a0;"></div>
          <span>棱 <em>l</em>（二面角的边）</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background:#ffd700;"></div>
          <span>角平分线（辅助线）</span>
        </div>
        <div class="legend-item">
          <div class="legend-swatch" style="border: 2px solid #f0a040; background: transparent; border-radius: 50%;"></div>
          <span>二面角弧（度量弧）</span>
        </div>
      </div>
    </div>

    <!-- Definition -->
    <div class="card">
      <h2>概念提示</h2>
      <div class="def-box">
        从二面角的<strong>棱</strong>上任意一点，分别在两个<strong>半平面</strong>内作垂直于棱的射线，这两条射线所成的角即为二面角的<strong>大小</strong>。
      </div>
    </div>

  </div>
</div>

<footer>鼠标左键拖动旋转 · 滚轮缩放 · 支持触屏操作</footer>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// --- State ---
let angle = 90;       // dihedral angle in degrees
let arcRadius = 60;   // arc radius (pixels in 3D space units)
let zoom = 1.0;
let autoMode = false;
let autoDir = 1;

// Camera orbit
let rotX = 0.38;  // pitch
let rotY = 0.52;  // yaw
let dragging = false;
let lastX, lastY;

// --- Resize ---
function resize() {
  const wrap = canvas.parentElement;
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
}
window.addEventListener('resize', () => { resize(); draw(); });
resize();

// --- 3D Math ---
function project(x, y, z, cx, cy, scale) {
  // Simple perspective projection after rotation
  // Apply rotY (yaw) then rotX (pitch)
  let cosY = Math.cos(rotY), sinY = Math.sin(rotY);
  let cosX = Math.cos(rotX), sinX = Math.sin(rotX);

  // Rotate around Y axis
  let x1 = x * cosY - z * sinY;
  let z1 = x * sinY + z * cosY;

  // Rotate around X axis
  let y2 = y * cosX - z1 * sinX;
  let z2 = y * sinX + z1 * cosX;

  // Perspective
  let fov = 600;
  let pz = fov / (fov + z2 * scale * 0.5 + 200);

  return {
    sx: cx + x1 * scale * pz,
    sy: cy - y2 * scale * pz,
    depth: z2
  };
}

function p3(x, y, z) {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  return project(x, y, z, cx, cy, zoom * 1.8);
}

// --- Drawing Helpers ---
function line3(ax, ay, az, bx, by, bz, color, width, dash) {
  const a = p3(ax, ay, az);
  const b = p3(bx, by, bz);
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = width || 1.5;
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath();
  ctx.moveTo(a.sx, a.sy);
  ctx.lineTo(b.sx, b.sy);
  ctx.stroke();
  ctx.restore();
}

function fillPoly3(pts, color) {
  if (pts.length < 2) return;
  const pp = pts.map(p => p3(...p));
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(pp[0].sx, pp[0].sy);
  for (let i = 1; i < pp.length; i++) ctx.lineTo(pp[i].sx, pp[i].sy);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function dot3(x, y, z, color, r) {
  const p = p3(x, y, z);
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(p.sx, p.sy, r || 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function label3(x, y, z, text, color, dx, dy, size) {
  const p = p3(x, y, z);
  ctx.save();
  ctx.fillStyle = color || '#fff';
  ctx.font = `${size || 15}px 'Noto Serif SC', serif`;
  ctx.fillText(text, p.sx + (dx || 0), p.sy + (dy || 0));
  ctx.restore();
}

// Draw a filled arc in 3D on a plane perpendicular to the edge (Y axis)
function drawArc3D(cx, cy, cz, r, startAngle, endAngle, color, fill) {
  const steps = 80;
  const pts = [];
  if (fill) pts.push([cx, cy, cz]);
  for (let i = 0; i <= steps; i++) {
    const t = startAngle + (endAngle - startAngle) * i / steps;
    pts.push([cx + r * Math.cos(t), cy, cz + r * Math.sin(t)]);
  }
  if (fill) {
    fillPoly3(pts, color);
  } else {
    const pp = pts.map(p => p3(...p));
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(pp[0].sx, pp[0].sy);
    for (let i = 1; i < pp.length; i++) ctx.lineTo(pp[i].sx, pp[i].sy);
    ctx.stroke();
    ctx.restore();
  }
}

// --- Main Draw ---
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background grid (subtle)
  drawGrid();

  const rad = angle * Math.PI / 180;
  const halfRad = rad / 2;

  // Plane size
  const W = 130, H = 100;
  // Edge (棱 l) along Y axis
  const edgeLen = 120;

  // Half-plane α: from edge in direction (cos(0), 0, sin(0)) = (1,0,0)
  // Half-plane β: from edge in direction (cos(rad), 0, sin(rad))
  const ax = 1, az = 0;
  const bx = Math.cos(rad), bz = Math.sin(rad);

  // Plane vertices
  const alpha = [
    [0, -edgeLen/2, 0],
    [0, edgeLen/2, 0],
    [W * ax, edgeLen/2, W * az],
    [W * ax, -edgeLen/2, W * az],
  ];
  const beta = [
    [0, -edgeLen/2, 0],
    [0, edgeLen/2, 0],
    [W * bx, edgeLen/2, W * bz],
    [W * bx, -edgeLen/2, W * bz],
  ];

  // Sort draw order (painter's algorithm — simple depth heuristic)
  const alphaDepth = alpha.reduce((s, p) => s + p3(...p).depth, 0) / 4;
  const betaDepth = beta.reduce((s, p) => s + p3(...p).depth, 0) / 4;

  const drawOrder = [
    { pts: alpha, color: 'rgba(64,160,255,0.22)', edgeColor: '#40a0ff', name: 'α', ex: W*ax, ez: W*az },
    { pts: beta,  color: 'rgba(255,160,64,0.22)', edgeColor: '#ffa040', name: 'β', ex: W*bx, ez: W*bz },
  ].sort((a, b) => {
    const da = a.pts.reduce((s,p)=>s+p3(...p).depth,0)/4;
    const db = b.pts.reduce((s,p)=>s+p3(...p).depth,0)/4;
    return db - da; // back first
  });

  // Draw planes
  for (const pl of drawOrder) {
    fillPoly3(pl.pts, pl.color);
  }

  // Arc fill (angle indicator) — behind edges
  const arcR = arcRadius * 0.55;
  drawArc3D(0, 0, 0, arcR, 0, rad, 'rgba(240, 160, 64, 0.12)', true);
  // Arc stroke
  drawArc3D(0, 0, 0, arcR, 0, rad, '#f0a040', false);

  // Angle bisector line (辅助线)
  const bisX = Math.cos(halfRad), bisZ = Math.sin(halfRad);
  line3(0, 0, 0, bisX * arcR * 1.1, 0, bisZ * arcR * 1.1, 'rgba(255,215,0,0.5)', 1.5, [4, 4]);

  // Draw plane borders
  for (const pl of drawOrder) {
    // Outer edge of plane
    const pts = pl.pts;
    line3(...pts[2], ...pts[3], pl.edgeColor, 1.5, [5, 4]);
    line3(...pts[0], ...pts[3], pl.edgeColor, 1.5);
    line3(...pts[1], ...pts[2], pl.edgeColor, 1.5);
  }

  // 棱 l (edge) — dashed green
  line3(0, -edgeLen/2, 0, 0, edgeLen/2, 0, '#a0e0a0', 2.5, [8, 5]);

  // Perpendicular rays from midpoint of edge (度量射线)
  const rayLen = arcRadius * 1.15;
  line3(0, 0, 0, rayLen * ax, 0, rayLen * az, '#40a0ff', 2.5);
  line3(0, 0, 0, rayLen * bx, 0, rayLen * bz, '#ffa040', 2.5);

  // Right angle marks if 90°
  if (Math.abs(angle - 90) < 1.5) {
    drawRightAngle(ax, az, 12);
  }

  // Arrowheads on rays
  arrow3(rayLen * 0.85 * ax, 0, rayLen * 0.85 * az, rayLen * ax, 0, rayLen * az, '#40a0ff');
  arrow3(rayLen * 0.85 * bx, 0, rayLen * 0.85 * bz, rayLen * bx, 0, rayLen * bz, '#ffa040');

  // Endpoint dots
  dot3(0, 0, 0, '#ffffff', 5); // vertex on edge
  dot3(0, -edgeLen/2, 0, '#a0e0a0', 4);
  dot3(0, edgeLen/2, 0, '#a0e0a0', 4);

  // Labels
  label3(rayLen * ax + 6, 0, rayLen * az, 'm', '#7abfff', 0, 4, 17);
  label3(rayLen * bx + 6, 0, rayLen * bz, 'n', '#ffbf70', 0, 4, 17);
  label3(0, edgeLen/2 + 8, 0, 'l', '#a0e0a0', 0, 0, 17);

  // Plane labels
  label3(W * 0.6 * ax, edgeLen/2 - 10, W * 0.6 * az, 'α', '#7abfff', 0, 0, 18);
  label3(W * 0.6 * bx, edgeLen/2 - 10, W * 0.6 * bz, 'β', '#ffbf70', 0, 0, 18);

  // Angle label near arc
  const midA = halfRad;
  const lx = Math.cos(midA) * (arcR + 16);
  const lz = Math.sin(midA) * (arcR + 16);
  const lp = p3(lx, 0, lz);
  ctx.save();
  ctx.fillStyle = '#f0c060';
  ctx.font = "bold 15px 'JetBrains Mono', monospace";
  ctx.fillText(`${angle}°`, lp.sx - 14, lp.sy + 5);
  ctx.restore();

  // Vertex label
  label3(4, 4, 2, 'O', '#ffffff', 0, 0, 15);
}

function drawGrid() {
  const cx = canvas.width / 2, cy = canvas.height / 2;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  const step = 40;
  for (let x = cx % step; x < canvas.width; x += step) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = cy % step; y < canvas.height; y += step) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }
  ctx.restore();
}

function arrow3(x1, y1, z1, x2, y2, z2, color) {
  const a = p3(x1, y1, z1);
  const b = p3(x2, y2, z2);
  const dx = b.sx - a.sx, dy = b.sy - a.sy;
  const len = Math.sqrt(dx*dx + dy*dy);
  if (len < 1) return;
  const ux = dx/len, uy = dy/len;
  const aw = 9, ah = 14;
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(b.sx, b.sy);
  ctx.lineTo(b.sx - uh(ux,uy,aw,ah)[0], b.sy - uh(ux,uy,aw,ah)[1]);
  ctx.lineTo(b.sx - up(ux,uy,aw,ah)[0], b.sy - up(ux,uy,aw,ah)[1]);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function uh(ux,uy,aw,ah){return [ux*ah - uy*aw/2, uy*ah + ux*aw/2];}
function up(ux,uy,aw,ah){return [ux*ah + uy*aw/2, uy*ah - ux*aw/2];}

function drawRightAngle(ax, az, s) {
  // Small square at origin in XZ plane
  const pts = [
    [0, 0, 0],
    [s * ax, 0, s * az],
    [s * ax + s * (-az), 0, s * az + s * ax],
    [s * (-az), 0, s * ax],
  ];
  const pp = pts.map(p => p3(...p));
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(pp[1].sx, pp[1].sy);
  ctx.lineTo(pp[2].sx, pp[2].sy);
  ctx.lineTo(pp[3].sx, pp[3].sy);
  ctx.stroke();
  ctx.restore();
}

// --- Interaction ---
canvas.addEventListener('mousedown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener('mousemove', e => {
  if (!dragging) return;
  rotY += (e.clientX - lastX) * 0.007;
  rotX += (e.clientY - lastY) * 0.007;
  rotX = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, rotX));
  lastX = e.clientX; lastY = e.clientY;
  draw();
});
canvas.addEventListener('mouseup', () => dragging = false);
canvas.addEventListener('mouseleave', () => dragging = false);

canvas.addEventListener('wheel', e => {
  zoom *= e.deltaY > 0 ? 0.93 : 1.07;
  zoom = Math.max(0.3, Math.min(3.5, zoom));
  document.getElementById('zoomSlider').value = Math.round(zoom * 100);
  draw();
  e.preventDefault();
}, { passive: false });

// Touch support
let lastTouchX, lastTouchY;
canvas.addEventListener('touchstart', e => {
  lastTouchX = e.touches[0].clientX;
  lastTouchY = e.touches[0].clientY;
});
canvas.addEventListener('touchmove', e => {
  rotY += (e.touches[0].clientX - lastTouchX) * 0.008;
  rotX += (e.touches[0].clientY - lastTouchY) * 0.008;
  rotX = Math.max(-Math.PI/2+0.05, Math.min(Math.PI/2-0.05, rotX));
  lastTouchX = e.touches[0].clientX;
  lastTouchY = e.touches[0].clientY;
  draw();
  e.preventDefault();
}, { passive: false });

// Sliders
document.getElementById('angleSlider').addEventListener('input', function() {
  angle = +this.value;
  document.getElementById('angleVal').innerHTML = angle + '<sup>°</sup>';
  draw();
});

document.getElementById('radiusSlider').addEventListener('input', function() {
  arcRadius = +this.value;
  draw();
});

document.getElementById('zoomSlider').addEventListener('input', function() {
  zoom = +this.value / 100;
  draw();
});

function setAngle(a) {
  angle = a;
  document.getElementById('angleSlider').value = a;
  document.getElementById('angleVal').innerHTML = a + '<sup>°</sup>';
  draw();
}

// Auto mode
let autoTimer = null;
function toggleAuto() {
  autoMode = !autoMode;
  const btn = document.getElementById('autoBtn');
  const dot = document.getElementById('autoDot');
  const txt = document.getElementById('autoTxt');
  if (autoMode) {
    btn.classList.add('active');
    dot.style.display = 'inline-block';
    txt.textContent = '⏹ 停止自动旋转';
    autoTimer = setInterval(() => {
      angle += autoDir * 0.6;
      if (angle >= 175) autoDir = -1;
      if (angle <= 5) autoDir = 1;
      document.getElementById('angleSlider').value = Math.round(angle);
      document.getElementById('angleVal').innerHTML = Math.round(angle) + '<sup>°</sup>';
      draw();
    }, 16);
  } else {
    btn.classList.remove('active');
    dot.style.display = 'none';
    txt.textContent = '▶ 自动旋转角度';
    clearInterval(autoTimer);
    angle = Math.round(angle);
    document.getElementById('angleSlider').value = angle;
  }
}

// Initial draw
draw();
</script>
</body>
</html>
